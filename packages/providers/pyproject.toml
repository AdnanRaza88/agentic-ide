[project]
name = "agentic-ide-providers"
version = "0.1.0"
description = "ModelProvider adapters and registry for Agentic IDE"
requires-python = ">=3.11"
dependencies = [
    "agentic-ide-contracts>=0.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_ide_providers"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["agentic_ide_providers", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_ide_providers", "agentic_ide_contracts"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
