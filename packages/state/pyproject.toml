[project]
name = "agentic-ide-state"
version = "0.1.0"
description = "Persistent state and session subsystem for Agentic IDE"
requires-python = ">=3.11"
dependencies = [
    "agentic-ide-contracts>=0.1.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "pydantic>=2.9.0",
    "greenlet>=3.1.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30.0"]
sqlite = ["aiosqlite>=0.20.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_ide_state"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["agentic_ide_state", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_ide_state", "agentic_ide_contracts"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
