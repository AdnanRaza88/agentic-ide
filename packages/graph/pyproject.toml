[project]
name = "agentic-ide-graph"
version = "0.1.0"
description = "Graph / control-flow engine for Agentic IDE"
requires-python = ">=3.11"
dependencies = [
    "agentic-ide-contracts>=0.1.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_ide_graph"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["agentic_ide_graph", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_ide_graph", "agentic_ide_contracts"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
